name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The logic under test — chunk planning, the word-level merger, loop
      # collapse, map-reduce windowing, the speaker clustering rules — is pure
      # Python over plain data structures. No whisper, no pyannote, no GPU, no
      # network. Four of the six files reach it through `modal_app`, which
      # imports the Modal client at module level, so that one small pure-Python
      # package is installed and nothing else is.
      - name: Install the one import the tests reach through
        run: pip install --quiet modal

      - name: Tests
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "── $t"
            python "$t" || failed=1
          done
          exit $failed
