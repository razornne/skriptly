name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The logic under test — chunk planning, the word-level merger, loop
      # collapse, map-reduce windowing, the speaker clustering rules — is pure
      # Python over plain data structures. No whisper, no pyannote, no GPU, no
      # network and no model weights. What it does need is the handful of
      # imports it reaches through: `modal_app` pulls in the Modal client at
      # module level, and the clustering routine uses numpy. Those two, and
      # nothing else — installing the real requirements.txt would drag in
      # whisper and pyannote to test arithmetic.
      - name: Install what the tests reach through
        run: pip install --quiet modal numpy

      - name: Tests
        run: |
          failed=0
          for t in tests/test_*.py; do
            echo "── $t"
            python "$t" || failed=1
          done
          exit $failed
